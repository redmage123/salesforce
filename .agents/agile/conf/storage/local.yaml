# Local Storage Configuration (SQLite-based)
# All paths are relative to .agents/agile directory
rag_db_type: sqlite
rag_db_path: ${oc.env:ARTEMIS_RAG_DB_PATH,db}
chromadb_host: null
chromadb_port: null

# Core directories
temp_dir: ${oc.env:ARTEMIS_TEMP_DIR,../../.artemis_data/temp}
checkpoint_dir: ${oc.env:ARTEMIS_CHECKPOINT_DIR,../../.artemis_data/checkpoints}
state_dir: ${oc.env:ARTEMIS_STATE_DIR,../../.artemis_data/state}
status_dir: ${oc.env:ARTEMIS_STATUS_DIR,../../.artemis_data/status}

# Artifact directories
adr_dir: ${oc.env:ARTEMIS_ADR_DIR,../../.artemis_data/adrs}
developer_output_dir: ${oc.env:ARTEMIS_DEVELOPER_DIR,../../.artemis_data/developer_output}
code_review_dir: ${oc.env:ARTEMIS_CODE_REVIEW_DIR,../../.artemis_data/code_reviews}
test_output_dir: ${oc.env:ARTEMIS_TEST_OUTPUT_DIR,../../.artemis_data/test_output}
requirements_dir: ${oc.env:ARTEMIS_REQUIREMENTS_DIR,../../.artemis_data/requirements}

# Database and storage files
persistence_db: ${oc.env:ARTEMIS_PERSISTENCE_DB,../../.artemis_data/artemis_persistence.db}
message_dir: ${oc.env:ARTEMIS_MESSAGE_DIR,../../.artemis_data/agent_messages}
cost_tracking_dir: ${oc.env:ARTEMIS_COST_DIR,../../.artemis_data/cost_tracking}
git_operations_dir: ${oc.env:ARTEMIS_GIT_OPS_DIR,../../.artemis_data/git_operations}
