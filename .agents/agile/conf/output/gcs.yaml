# Google Cloud Storage Output Configuration
# Stores all outputs to GCS

storage_type: remote
local_path: ../../outputs
remote:
  provider: gcs
  s3:
    bucket: null
    region: null
  gcs:
    bucket: ${oc.env:ARTEMIS_GCS_BUCKET,my-artemis-bucket}
    project: ${oc.env:ARTEMIS_GCS_PROJECT,my-gcp-project}
  azure:
    container: null
    storage_account: null
