# S3 Output Storage Configuration
# Stores all outputs to AWS S3

storage_type: remote
local_path: ../../outputs
remote:
  provider: s3
  s3:
    bucket: ${oc.env:ARTEMIS_S3_BUCKET,my-artemis-bucket}
    region: ${oc.env:ARTEMIS_S3_REGION,us-east-1}
  gcs:
    bucket: null
    project: null
  azure:
    container: null
    storage_account: null
