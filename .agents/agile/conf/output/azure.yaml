# Azure Blob Storage Output Configuration
# Stores all outputs to Azure

storage_type: remote
local_path: ../../outputs
remote:
  provider: azure
  s3:
    bucket: null
    region: null
  gcs:
    bucket: null
    project: null
  azure:
    container: ${oc.env:ARTEMIS_AZURE_CONTAINER,artemis-output}
    storage_account: ${oc.env:ARTEMIS_AZURE_STORAGE_ACCOUNT,mystorageaccount}
